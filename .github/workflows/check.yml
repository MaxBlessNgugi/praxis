name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The console's browser audits sign in against the **real** API — they call POST /api/auth/login
    # through the gate, and `requireSignIn` aborts the run when that is refused. So this job needs a
    # database and a running API of its own; without them the audits cannot even reach the console,
    # and a green tick would mean the audits never ran rather than that they passed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis?schema=public
      DIRECT_URL: postgresql://praxis:praxis@localhost:5432/praxis?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      PORT: 4000
      # The audits open the console at 127.0.0.1:3000, which is a different origin from localhost:3000
      # as far as a browser is concerned. Both are listed so the sign-in is not refused by CORS.
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install the console
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: install the API
        working-directory: backend
        run: npm ci

      - name: build the database from the migrations and seed it
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run seed

      # Started detached and then *waited for*: the audits drive a browser, and a browser pointed at
      # an API that is still booting reports a CORS failure rather than a slow start.
      - name: start the API
        working-directory: backend
        run: |
          npm run dev > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the API never answered on :4000"
          cat /tmp/api.log
          exit 1

      - name: start the console
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the console never answered on :3000"
          cat /tmp/dev.log
          exit 1

      # Both audits exit non-zero when their report holds a failure, so a green check means clean.
      - name: accessibility audit
        run: node tools/audit-a11y.mjs

      - name: dialog audit
        run: node tools/audit-dialogs.mjs

      # Multi-tenancy is enforced in the request path, so it is verified there: this signs in as a
      # second church and tries to read, change, retire and restore the first church's records with
      # the API's own endpoints. It exits non-zero on any check that succeeds when it should not, and
      # it removes the church it provisioned either way.
      - name: one church cannot reach another's records
        working-directory: backend
        run: npx tsx tools/tenant-isolation.ts

      # The people domain, which the suites above only touch in passing: a household staffed, headed,
      # emptied before it may retire and put back from the trash; a ministry whose roll re-rolls a
      # returning member and refuses retirement while anybody still serves; and the two boundaries
      # the console's buttons claim — a viewer who may read but not write, a staff member who may
      # write but not retire. It runs in a probe church of its own and removes it either way.
      - name: households, ministries and the role matrix
        working-directory: backend
        run: npm run check:people

      # The circles that meet midweek: a group convened with its leader, its roll staffed, a meeting
      # recorded and corrected, retirement refused while anybody still belongs, the trash that takes
      # it back, the role matrix again on the new surface, and a second church that cannot reach
      # another's circle at all. It runs in probe churches of its own and removes them either way.
      - name: groups, fellowships and their meetings
        working-directory: backend
        run: npm run check:groups

      # The operator's side, which crosses tenants by design and so needs its own proof: suspension
      # refusing a sign-in and saying why, a support session that is scoped, audited and one-way, and
      # an outbound send that is refused rather than recorded as delivered when no provider is set.
      - name: the vendor console and the outbound gateways
        working-directory: backend
        run: npm run check:vendor

      # The account's own lifecycle: a password change that ends the other sessions and keeps this
      # one, a reset link that is single-use, expiring, and stored only as a hash. It works on a
      # throwaway account rather than the seeded administrator's.
      - name: the authentication lifecycle
        working-directory: backend
        run: npm run check:auth

      # Failed responses, in both environments: that each one keeps the shape the console reads, and
      # that a production server names no file, host or stack while a development one still says what
      # broke. It needs no database and no running service.
      - name: failures keep their shape
        working-directory: backend
        run: npm run check:errors

      # The register arriving as a spreadsheet, which is how every parish's data actually gets in.
      # It checks the report a clerk reads before anything is written, the duplicate keys that make a
      # second import safe, and the spreadsheet shapes that break a naive parser — a BOM, semicolon
      # delimiters, Excel date serials — then removes the rows it wrote.
      - name: a register can be imported from a spreadsheet
        working-directory: backend
        run: npm run check:import

      # The commercial path end to end, on a church that did not exist a minute ago: sign itself up,
      # finish the welcome wizard, enrol a member, record a tithe, plan a service, publish an
      # announcement, watch the next church be unable to see any of it, sign out. It removes the
      # church it created whether it passes or fails.
      - name: a church can sign itself up and use the whole system
        working-directory: backend
        run: npm run check:launch

      # The money, which is the part of the system a parish cannot afford to be wrong about: a gift
      # recorded and read back, filters and totals answered by the server rather than by the page, a
      # mistake voided with its reason kept and restored again, an entry edited straight in the
      # database caught by the hash chain, and a second church unable to see any of it. It runs in a
      # probe church of its own and removes it either way.
      - name: giving adds up, and tampering is caught
        working-directory: backend
        run: npm run check:finance

      # The services and worship domain, which is where a volunteer is given something to do rather
      # than a name on a list: a service scheduled with its room and hour kept honest, the order of
      # service stored in the order it was sent, a duplicate duty refused, a swap asked for by the
      # holder and decided by an administrator with the duty actually moving, a census revised rather
      # than counted twice, a report signed off and read-only afterwards, and a second church unable
      # to reach any of it. It runs in a probe church of its own and removes it either way.
      - name: services, rosters and a signed-off service report
        working-directory: backend
        run: npm run check:worship

      # The stock room: quantities that survive concurrent receipts from opposite sides without
      # deadlocking, an issue refused when the shelf cannot cover it, a transfer that sums to zero on
      # the ledger, a stock take whose approval is the only thing that moves stock, a retired item
      # whose movements still sum to zero, and a second church unable to reach any of it. It runs in
      # a probe church of its own and removes it either way.
      - name: the stock ledger adds up under concurrency
        working-directory: backend
        run: npm run check:inventory

      # The council: a quorum counted from the roll of offices rather than claimed by whoever files
      # the notice, a minute sealed once the sitting has been held and the words written, the register
      # fixed afterwards, a resolution moving proposed → voted → implemented → closed with every
      # shortcut refused, the by-law library keeping the version in force and the copy the church
      # holds, and a second church unable to reach any of it. It runs in a probe church of its own and
      # removes it either way.
      - name: the council's sittings, resolutions and by-laws
        working-directory: backend
        run: npm run check:governance

      # What the church says and what it prays for: a notice's importance stored rather than styled,
      # a board made of two dates, a campaign written and scheduled before it is sent, a send on a
      # channel with no provider refused rather than recorded as delivered, an organiser named from
      # this church's own register — and a private prayer request that never reaches an account the
      # server has not authorised, in the list, in the counts, or by its id. It runs in a probe church
      # of its own and removes it either way.
      - name: notices, broadcasts, the calendar and the prayer wall
        working-directory: backend
        run: npm run check:communications

      # Serials, reissue, the CSV exports and their filters, in a probe church of its own.
      - name: reports, certificates and exports
        working-directory: backend
        run: npm run check:reports

      # Files: delete-to-Trash-to-restore, preference persistence and audit, the export's honesty.
      - name: settings, files and data tools
        working-directory: backend
        run: npm run check:settings

      # The SaaS lifecycle, end to end: signup onto a trial, conversion by payment, an early renewal
      # that *adds* a month, past due and expired arriving by the clock, a lapsed church that can still
      # read everything it owns but write nothing, and one payment restoring all of it.
      - name: the billing lifecycle
        working-directory: backend
        run: npm run check:billing

      # Deliberately last of the API checks: it exercises the sign-in rate limiter to prove the
      # ceiling exists, which leaves this address throttled for up to a minute afterwards.
      - name: the security posture
        working-directory: backend
        run: npm run check:security

  # The console's typecheck does not compile `backend/`: the root `tsconfig.json` excludes it, because
  # the service has its own compiler options (commonjs, `strict`, `noUnusedLocals`), its own lockfile
  # and its own generated Prisma client. Checking it here instead keeps that exclusion from being a hole.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `@prisma/client` generates the client from the schema on install, so the typecheck below runs
      # against the real generated types rather than an empty `@prisma/client` export.
      - name: install
        run: npm ci

      # `prisma validate` parses the schema and never opens a connection, so a placeholder URL is
      # enough here and no database service is needed.
      - name: validate the schema
        env:
          DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis?schema=public
          DIRECT_URL: postgresql://praxis:praxis@localhost:5432/praxis?schema=public
        run: npx prisma validate

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

  # Nothing above proves a database can be built from this repository — the typecheck job reads types
  # and the checks below it read nothing. This job builds one: a Postgres service container, the
  # checked-in migration applied to an empty database, the seed, and a parity check that
  # `prisma/migrations/` still describes `schema.prisma`. A migration that no longer matches the
  # schema fails the pull request instead of surfacing as a runtime error in a parish office.
  provision:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis" --health-interval 5s --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis?schema=public
      # Locally the pooled and direct connections are the same line; the split only matters on Neon.
      DIRECT_URL: postgresql://praxis:praxis@localhost:5432/praxis?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: install
        run: npm ci

      - name: build the schema from the migration alone
        run: npx prisma migrate deploy

      # The seed is what proves the schema is not merely present but usable: it writes through the
      # generated client, and the counts are asserted so an empty database cannot pass as provisioned.
      # The numbers are the shape of a parish — a register, the seven departments, and real giving
      # history behind them — because "1 member" provisioned correctly is not a database anybody can
      # hand to the office.
      - name: seed it, and assert the seed wrote a parish
        run: |
          npm run seed
          node -e '
            const { PrismaClient } = require("@prisma/client");
            const prisma = new PrismaClient();
            (async () => {
              const members = await prisma.member.count();
              const ministries = await prisma.ministry.count();
              const services = await prisma.service.count();
              const tithes = await prisma.tithe.count();
              const ledger = await prisma.financeAuditEntry.count();
              // The commercial layer too: without plans there is nothing for a church to be on, and
              // without a subscription the console opens on a church that has never been provisioned.
              const plans = await prisma.plan.count();
              const subscriptions = await prisma.subscription.count();
              const church = await prisma.organization.findFirst({ where: { slug: "destiny-sanctuary" } });
              await prisma.$disconnect();
              console.log(`seed wrote ${members} members, ${ministries} departments, ${services} services, ${tithes} tithes, ${ledger} ledger entries, ${plans} plans and ${subscriptions} subscription(s)`);
              if (members < 10 || ministries !== 7 || services < 5 || tithes < 20 || ledger < 40) process.exit(1);
              if (plans !== 3 || subscriptions < 1 || !church || !church.onboardedAt) process.exit(1);
            })();
          '

      # `migrate diff` needs an empty shadow database to replay the migrations into; `db execute`
      # creates it so this job needs no Postgres client of its own. `--exit-code` returns 2 on any
      # difference, which fails the step.
      - name: the migrations still describe the schema
        env:
          ADMIN_DATABASE_URL: postgresql://praxis:praxis@localhost:5432/postgres
          SHADOW_DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis_shadow
        run: |
          npx prisma db execute --url "$ADMIN_DATABASE_URL" --stdin <<'SQL'
          CREATE DATABASE praxis_shadow;
          SQL
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
